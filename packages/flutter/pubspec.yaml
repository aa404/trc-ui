name: trc_ui
description: >-
  Flutter widgets with a deep black design: near-black backgrounds, graphite
  cards, thin Montserrat headings, one accent color and pill buttons whose dot
  stretches on hover.
version: 0.1.0
homepage: https://ui.theringconcept.com
repository: https://github.com/aa404/trc-ui/tree/main/packages/flutter
issue_tracker: https://github.com/aa404/trc-ui/issues
topics:
  - ui
  - widgets
  - design-system
  - dark-theme
  - components

screenshots:
  - description: A page built with trc_ui, with its floating header and inset hero.
    path: doc/screenshots/hero.png
  - description: The floating glass bottom navigation over scrolling content.
    path: doc/screenshots/bottom-nav.png
  - description: Form controls with a select open on its list.
    path: doc/screenshots/forms.png
  - description: Pill buttons, one hovered with its dot stretched.
    path: doc/screenshots/pill.png

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Montserrat ships with the package (SIL Open Font License, see fonts/OFL.txt).
  # Widgets reference it with `package: 'trc_ui'`, so apps need no font setup.
  fonts:
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Light.ttf
          weight: 300
        - asset: fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: fonts/Montserrat-SemiBold.ttf
          weight: 600
